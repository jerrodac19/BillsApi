<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Projection</title>
    <link rel="manifest" href="/Projections/manifest.json">

    <script src="https://cdn.jsdelivr.net/npm/luxon/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon/dist/chartjs-adapter-luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-trendline/dist/chartjs-plugin-trendline.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1/dist/chartjs-plugin-annotation.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            gap: 15px;
        }

        .top-layout {
            display: flex;
            flex-direction: row;
            width: 90vw;
            gap: 15px;
            align-items: stretch;
            flex-shrink: 0;
        }

        .controls-panel {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 80px;
        }

        .slider-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: center;
        }

        .vertical-slider {
            writing-mode: bt-lr;
            appearance: slider-vertical;
            width: 8px;
            height: 100px;
            margin: 15px 0;
            accent-color: #4bc0c0;
            cursor: pointer;
        }

        .slider-label {
            font-size: 0.9em;
            text-align: center;
            margin-bottom: 5px;
            color: #b0b0b0;
        }

        .slider-value {
            font-weight: bold;
            color: #4bc0c0;
            margin-top: 5px;
        }

        .info-panel {
            flex: 1;
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

            .info-panel p {
                margin: 3px 0;
                font-size: 1.05em;
            }

        .chart-section {
            display: flex;
            flex-direction: column;
            width: 90vw;
            flex: 1;
            min-height: 250px;
        }

        .chart-container {
            --point-size: 4;
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            html, body {
                height: 100%;
            }

            .top-layout {
                flex-direction: column;
                width: 95vw;
            }

            .controls-panel {
                flex-direction: row;
                width: 100%;
                padding: 12px;
                justify-content: space-around;
            }

            .slider-wrapper {
                flex-direction: row;
                gap: 15px;
                align-items: center;
                height: auto;
            }

            .vertical-slider {
                writing-mode: horizontal-tb;
                appearance: auto;
                width: 200px;
                height: 20px;
                margin: 0;
            }

            .chart-section {
                width: 95vw;
                flex: 1;
                min-height: 300px;
            }

            .chart-container {
                --point-size: 1.0;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .chart-container {
                --point-size: 0.7;
                padding: 10px;
            }

            .info-panel p {
                font-size: 0.95em;
            }
        }
    </style>
</head>
<body>
    <div class="top-layout">
        <div class="controls-panel">
            <div class="slider-wrapper">
                <span class="slider-label">Alpha (&alpha;)</span>
                <input type="range" id="alphaSlider" class="vertical-slider" min="0" max="0.005" step="0.001" value="0">
                <span id="alphaValue" class="slider-value">0.00</span>
            </div>
        </div>
        <div id="info-panel" class="info-panel">
            <p>Loading financial data and projections...</p>
        </div>
    </div>

    <div class="chart-section">
        <div class="chart-container">
            <canvas id="myFinancialChart"></canvas>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/Projections/sw.js', { scope: '/Projections/' });
            });
        }
    </script>
    <script>
        let myChart = null;
        let fetchTimeoutId = null;
        const FETCH_TIMEOUT = 5000;

        document.addEventListener('DOMContentLoaded', () => {
            const alphaSlider = document.getElementById('alphaSlider');
            const alphaValueDisplay = document.getElementById('alphaValue');

            fetchAndRenderData(alphaSlider.value);

            alphaSlider.addEventListener('input', (event) => {
                const currentAlpha = event.target.value;
                alphaValueDisplay.textContent = parseFloat(currentAlpha).toFixed(2);

                clearTimeout(fetchTimeoutId);
                fetchTimeoutId = setTimeout(() => {
                    fetchAndRenderData(currentAlpha);
                }, 250);
            });
        });

        function loadDataFromIndexedDB() {
            const request = indexedDB.open('FinancialDB', 1);

            request.onsuccess = (event) => {
                const db = event.target.result;
                const transaction = db.transaction('analytics', 'readonly');
                const store = transaction.objectStore('analytics');
                const getRequest = store.get(1);

                getRequest.onsuccess = () => {
                    if (getRequest.result) {
                        const data = getRequest.result.content;
                        renderChart(data);
                        document.getElementById('info-panel').innerHTML += `<p style="color: yellow;">Currently in offline mode. Displaying last cached data.</p>`;
                        console.log('Loaded data from IndexedDB.');
                    }
                };
            };
        }

        function fetchAndRenderData(weightDecayRate = 0) {
            const controller = new AbortController();
            const signal = controller.signal;

            const timeoutId = setTimeout(() => {
                controller.abort();
                console.log('Network request timed out. Loading from IndexedDB.');
                loadDataFromIndexedDB();
            }, FETCH_TIMEOUT);

            const lentMoney = [{
                amount: 3019,
                startDate: '2024-11-15T07:00:00Z',
                endDate: '2025-01-16T07:00:00Z'
            }];

            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(lentMoney),
                signal: signal
            };

            fetch(`/api/balancemonitors/analytics?weightDecayRate=${weightDecayRate}&confidenceLevel=0.99`, options)
                    .then(response => {
                clearTimeout(timeoutId);
                return response.json();
            })
                .then(data => {
                    renderChart(data);
                    storeDataInIndexedDB(data);
                })
                .catch(error => {
                    if (error.name !== 'AbortError') {
                        console.error('There was a problem with the fetch operation:', error);
                    }
                });
        }

        function storeDataInIndexedDB(data) {
            const request = indexedDB.open('FinancialDB', 1);

            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                db.createObjectStore('analytics', { keyPath: 'id' });
            };

            request.onsuccess = (event) => {
                const db = event.target.result;
                const transaction = db.transaction('analytics', 'readwrite');
                const store = transaction.objectStore('analytics');

                const record = { id: 1, content: data, timestamp: Date.now() };
                store.put(record);

                transaction.oncomplete = () => {
                    console.log('Data stored successfully in IndexedDB');
                };
            };

            request.onerror = (event) => {
                console.error('IndexedDB error:', event.target.errorCode);
            };
        }

        function renderChart(data) {
            if (data.error) {
                console.error("Error from backend:", data.error);
                document.getElementById('info-panel').innerHTML = `<p style="color: red;">Error loading financial data: ${data.error}</p>`;
                return;
            }
            if (myChart) {
                myChart.destroy();
            }

            const pointSize = getComputedStyle(document.querySelector('.chart-container')).getPropertyValue('--point-size');
            const startDate = new Date(data.startTimeUnix * 1000);

            const formatDataForChart = (arr) => {
                return arr.map(point => ({
                    x: new Date(startDate.getTime() + point[0] * 24 * 60 * 60 * 1000),
                    y: point[1]
                }));
            };

            const historicalChartData = formatDataForChart(data.historicalData);
            const trendlineChartData = formatDataForChart(data.trendline);
            const lowerPIChartData = formatDataForChart(data.lowerPredictionInterval);
            const upperPIChartData = formatDataForChart(data.upperPredictionInterval);
            const averageDailySpending = (data.trendline[0][1] - data.trendline[1][1]) / (data.trendline[1][0] - data.trendline[0][0]);

            const pointColors = data.historicalWeights.map(weight => {
                const minOpacity = 0.0;
                const maxOpacity = 0.6;
                const normalizedWeight = minOpacity + weight * (maxOpacity - minOpacity);
                return `rgba(75, 192, 192, ${normalizedWeight})`;
            });
            const pointColorsBorder = data.historicalWeights.map(weight => {
                const minOpacity = 0.0;
                const maxOpacity = 1.0;
                const normalizedWeight = minOpacity + weight * (maxOpacity - minOpacity);
                return `rgba(75, 192, 192, ${normalizedWeight})`;
            });

            const minXDate = historicalChartData[0].x;
            let maxXDate = trendlineChartData[trendlineChartData.length - 1].x;
            const totalRangeMs = maxXDate.getTime() - minXDate.getTime();
            const bufferMs = totalRangeMs * 0.05;
            maxXDate = new Date(maxXDate.getTime() + bufferMs);

            let earliestRunOutDate = null;
            let latestRunOutDate = null;

            if (data.earliestRunOutDateX && data.earliestRunOutDateX !== Infinity) {
                earliestRunOutDate = new Date(startDate.getTime() + data.earliestRunOutDateX * 24 * 60 * 60 * 1000);
            }

            if (data.latestRunOutDateX && data.latestRunOutDateX !== Infinity) {
                latestRunOutDate = new Date(startDate.getTime() + data.latestRunOutDateX * 24 * 60 * 60 * 1000);
            }

            const earliestDateDisplay = earliestRunOutDate ? earliestRunOutDate.toLocaleDateString() : 'N/A (Money may not run out within projected range)';
            const latestDateDisplay = latestRunOutDate && latestRunOutDate !== Infinity ? latestRunOutDate.toLocaleDateString() : 'N/A (Money may not run out within projected range)';

            let trendlineinformation = [];
            trendlineinformation.push(`Money estimated to last until:`);
            trendlineinformation.push(`Earliest Date: ${earliestDateDisplay}`);
            trendlineinformation.push(`Latest Date: ${latestDateDisplay}`);
            trendlineinformation.push('&nbsp;');
            trendlineinformation.push(`Standard Error: $${data.ser.toFixed(2)}`);
            trendlineinformation.push(`RSquared: ${data.rSquared.toFixed(2)}`);
            trendlineinformation.push(`Average Daily Money Loss: $${averageDailySpending.toFixed(2)}`);
            trendlineinformation.push(`Prediction Confidence: %${(data.confidence * 100).toFixed(0)}`);
            const infoPanel = document.getElementById('info-panel');
            infoPanel.innerHTML = trendlineinformation.map(line => `<p>${line}</p>`).join('');

            const ctx = document.getElementById('myFinancialChart').getContext('2d');
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'Historical Balance',
                            data: historicalChartData,
                            backgroundColor: pointColors,
                            borderColor: pointColorsBorder,
                            type: 'scatter',
                            showLine: false,
                            pointRadius: pointSize
                        },
                        {
                            label: 'Trendline',
                            data: trendlineChartData,
                            borderColor: 'red',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0
                        },
                        {
                            label: 'Prediction Interval (Upper)',
                            data: upperPIChartData,
                            borderColor: 'rgba(0, 200, 0, 0.5)',
                            borderWidth: 1,
                            fill: false,
                            backgroundColor: 'rgba(0, 200, 0, 0.1)',
                            pointRadius: 0
                        },
                        {
                            label: 'Prediction Interval (Lower)',
                            data: lowerPIChartData,
                            borderColor: 'rgba(0, 200, 0, 0.5)',
                            borderWidth: 1,
                            fill: '-1',
                            backgroundColor: 'rgba(0, 200, 0, 0.1)',
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                tooltipFormat: 'MMM D, YYYY'
                            },
                            title: {
                                display: true,
                                text: 'Date'
                            },
                            min: minXDate,
                            max: latestRunOutDate
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Money Balance ($)'
                            },
                            min: 0
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: function (context) {
                                    return new Date(context[0].parsed.x).toLocaleDateString();
                                },
                                label: function (context) {
                                    return context.dataset.label + ': $' + context.parsed.y.toFixed(2);
                                }
                            }
                        },
                        annotation: {}
                    }
                }
            });

            setTimeout(() => {
                myChart.tooltip.setActiveElements([
                    {
                        datasetIndex: 0,
                        index: historicalChartData.length - 1
                    }
                ]);
                myChart.update();
            }, 500);
        }
    </script>
</body>
</html>
